{% extends 'SundayLeague/base.html' %}
{% block content %}
  <!-- Active teams -->
  <!-- Ideally we want filtering for active vs inactive stuff to be separate but that can be worried about later -->
  {% include 'SundayLeague/search_forms/basic_filter.html' %}

  <h2> Managing Teams </h2>
  {% for team in managing %}
    <a href="{% url 'detail_team' team.pk %}">
      <div class="card">
          <div class="game-card-header">
            <img src="{{team.getImageUrl}}" class="team-pfp">
            <p class="league-title">{{team.name}}</p>
          </div>
      </div>
    </a>
  {% endfor %}
  <h2>Active Teams</h2>
  {% for team in teams %}
   <a href="{% url 'detail_team' team.pk %}">
      <div class="card">
          <div class="game-card-header">
            <img src="{{team.getImageUrl}}" class="team-pfp">
            <p class="league-title">{{team.name}}</p>
          </div>
      </div>
    </a>
  {% endfor %}

  <div class="tool-bar">
    <a href="{% url 'create_team' %}"> Create a team </a>
  </div>
{% endblock %}
