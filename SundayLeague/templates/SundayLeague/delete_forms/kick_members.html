{% extends 'SundayLeague/base.html' %}

{% block content %}
  <h2>Kick Members from {{ team.name }}</h2>

  <form method="post">
    {% csrf_token %}

    {% for member in members %}
      <div>
        <label>
          <input type="checkbox" name="members" value="{{ member.id }}">
          {{ member.user.username }}
        </label>
      </div>
    {% endfor %}

    <button type="submit">Remove Selected Members</button>
  </form>
{% endblock %}
