{% extends 'SundayLeague/base.html' %}

{% block content %}
  <a href="{% url 'detail_league' league.pk %}">Back</a>
  <h2> Finalize score for {{game}} </h2>
  <p> Provide the final score for the match. The league admin can always override the final score. The league admin can also eject dishonest teams. </p>
  <div class="form-container">
    <form method="POST">
      {% csrf_token %}
      <table>
        {{form.as_table}}
      </table>

      <input type="submit" name="submit" value="Finalize">
    </form>
  </div>
{% endblock %}
