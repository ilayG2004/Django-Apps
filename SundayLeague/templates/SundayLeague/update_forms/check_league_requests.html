<!--
FILE: SundayLeague/check_league_requests.html
AUTHOR: Ilay Guler (ilay2004@bu.edu)
DESCRIPTION: Lists team admins' request to join a league, alongside an accept or ignore button. These buttons act as form submission, and will either associate the requesting team with the league or not. The league join request instance is also deleted afterward.
DATE: 4/21/2026
-->
{% extends 'SundayLeague/base.html' %}

{% block content %}
  <a href="{% url 'detail_league' league.pk %}" class="button">⬅️Back</a>
  {% if requests|length %}
    
    <a href="{% url 'detail_league' league.pk %}">Back</a>
    {% for req in requests.all %}
      <div>
        <p><a href="{% url 'detail_team' req.requesting_team.pk %}">{{ req.requesting_team.name }}</a> - {{ req.message }}</p>
        <form method="POST" action="{% url 'team_join_league' league.pk req.requesting_team.pk %}">
          {% csrf_token %}
          <button type="submit">Approve</button>
        </form>
        <form method="POST" action="{% url 'delete_league_request' league.pk req.requesting_team.pk %}">
          {% csrf_token %}
          <button type="submit">Ignore</button>
        </form>
      </div>
    {% endfor %}
  {% else %}
    <p>No requests right now</p>
  {% endif %}
{% endblock %}
