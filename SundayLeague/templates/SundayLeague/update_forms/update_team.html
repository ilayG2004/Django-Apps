{% extends 'SundayLeague/base.html' %}

{% block content %}
  <h2> Update team, {{team.name}}'s, info: </h2>
  <a href="{% url 'detail_team' team.pk %}" class="button">⬅️Back</a>
  <div class="form-container">
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <table>
        {{form.as_table}}
      </table>

      <input type="submit" name="submit" value="Update">
    </form>
  </div>
{% endblock %}
