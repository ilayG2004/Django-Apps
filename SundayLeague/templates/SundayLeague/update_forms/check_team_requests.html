<!--
FILE: SundayLeague/ceheck_team_requests.html
AUTHOR: Ilay Guler (ilay2004@bu.edu)
DESCRIPTION: Lists users' request to join a team, alongside an accept or ignore button. These buttons act as form submission, and will either create a new team member instance or not. The team join request instance is also deleted afterward.
DATE: 4/21/2026
-->
{% extends 'SundayLeague/base.html' %}

{% block content %}
  <a href="{% url 'detail_team' team.pk %}" class="button">⬅️Back</a>
  {% if requests|length %}
    
    {% for req in requests.all %}
      <h2>Requests</h2>
      <div>
        <p><a href="{% url 'detail_profile' req.requesting_user.slprofile.pk %}">{{ req.requesting_user.username }}</a> - {{ req.message }}</p>
        <form method="POST" action="{% url 'create_member' team.pk req.requesting_user.pk %}">
          {% csrf_token %}
          <button type="submit">Approve</button>
        </form>
        <form method="POST" action="{% url 'delete_team_request' team.pk req.requesting_user.pk %}">
          {% csrf_token %}
          <button type="submit">Ignore</button>
        </form>
      </div>
    {% endfor %}
  {% else %}
    <h2>No requests right now</h2>
  {% endif %}
{% endblock %}
