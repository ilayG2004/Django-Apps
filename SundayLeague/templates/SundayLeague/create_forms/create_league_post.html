{% extends 'SundayLeague/base.html' %}

{% block content %}
  <h2> Create a post </h2>
  <p> Connect with athletes across teams. Make a post! </p>
  <a href="{% url 'detail_league' league.pk %}" class="button">⬅️Back</a>
  <div class="form-container">
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <table>
        {{form.as_table}}
      </table>

      <input type="submit" name="submit" value="Create">
    </form>
  </div>
{% endblock %}
