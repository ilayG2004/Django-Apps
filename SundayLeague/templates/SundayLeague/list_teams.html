{% extends 'SundayLeague/base.html' %}

{% block content %}
  <h2>Discover Teams</h2>
  <h3>Teams looking for new members.</h3>
  {% include 'SundayLeague/search_forms/team_query.html' %}
  {% for team in teams %}
  <a href="{% url 'detail_team' team.pk %}">
    <div class="card">
        <div class="game-card-header">
          <img src="{{team.getImageUrl}}" class="team-pfp">
          <p class="league-title">{{team.name}}</p>
        </div>
        <p class="type-text">Members: {{team.getTeamMembers|length}}</p>
        <p class="seriousness">Bio: {{team.bio}}</p>
    </div>
  </a>
  {% endfor %}
{% endblock %}
