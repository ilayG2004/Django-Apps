{% extends 'SundayLeague/base.html' %}

{% block content %}
  <h2>Leagues Starting Soon</h2>
  {% for league in leagues %}
    <a href="{% url 'detail_league' league.pk %}">
    <div class="card">
      <p class="league-title">{{league.league_name}}</p>
      <p class="type-text">Sport: {{league.sport_type}}</p>
      <p class="seriousness">Level: {{league.level}}</p>
      <p class="dates">{{league.season_start}} - {{league.season_end}}</p>
    </div>
  {% endfor %}
 
{% endblock %}
