{% block content %}
<div class="search-bar">
  <form method="GET">
  
    <label>Name:</label>
    <input type="text" name="name" value="{% if request.GET.name %}{{ request.GET.name }}{% endif %}">

    <button type="submit">Filter</button>
    <a href="{{ request.path }}">Reset</a>
  </form>
</div>
{% endblock %}
