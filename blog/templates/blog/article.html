{% extends 'blog/base.html' %}

{% block content %}
  <h1>{{article.title}}</h1>
  <main class="grid-container">
      <article>
        <div>
          <h3>{{article.author}}</h3>
          <p>
            {{article.text}}
          </p>
        </div>
        {% if article.image_file %}
        <img src={{article.image_file.url}} width="100rem" height="auto">
        {% else %}
        <h3>No image</h3>
        {% endif %}
        <a href="{% url 'update_article' article.pk %}">Update Article</a>
      </article>
  </main>
  
{% endblock %}
