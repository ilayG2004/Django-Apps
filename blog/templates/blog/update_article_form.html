{% extends "blog/base.html" %}

{% block content %}
<h1>Update Article</h1>
<form method="POST" enctype="multipart/form-data" action="{% url 'update_article' article.pk %}">
  {% csrf_token %}
  <table>
  {{form.as_table}}
  </table>

  <input type="submit" name="submit" value="Update">
</form>
<form action="{% url 'article' article.pk %}" method="GET">
  <input type="submit" value="Cancel">
</form>
{% endblock %}
