{% extends 'mini_insta/base.html' %}
{% block content %}
  <h2>{{profile.username}}, are you sure you want to delete post, {{post}}?</h2>
  <div>
  <form method="POST">
    {% csrf_token %}
    <input type="submit" name="submit" value="Delete">
  </form>   
  <!--Return to the profile-->
  <form method="GET" action="{% url 'show_profile' profile.pk %}">
    <input type="submit" name="cancel" value="Cancel">
  </form>
  </div>
{% endblock %}
