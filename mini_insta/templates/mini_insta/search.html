{% extends "mini_insta/base.html" %}
{% load static %}
{% block content %}
<div class="feed-pane">
  <h3>Search profiles or posts </h3>
  <form method="GET" action="{% url 'search' %}">
    {% csrf_token %}
    <input type="text" name="query">
    <input type="submit" name="submit">
  </form>
  </div>
{% endblock %}
