Changes 2/19: Displays posts, showing the posts' first associated image and its caption.
-->
{% extends 'mini_insta/base.html' %}
{% block content %}
  <div class="profile">
    <div class="profile-overview">
      <div class="follows-and-profile">
        <img src="{{profile.profile_image_url}}">
        <div class="name-and-follows">
          <h2>{{profile.display_name}}</h2>
          <h3>{{profile.username}}</h3>
          <div class="follows">
            <p>Followers: TBD</p>
            <p>Following: TBD</p>
          </div>
        </div>
      </div>
      <p class="bio">{{profile.bio_text}}</p>
    </div>
    <div class="posts">
      {% for post in profile.get_all_posts %}
      <div class="profile-rectangle">
        <div class="post">
          <a href="{% url 'show_post' post.pk %}">
            <img src="{{post.get_all_photos.first.image_url}}">
            <p>{{post.caption}}</p>
          </a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
{% endblock %}
