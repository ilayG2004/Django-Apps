{% extends 'mini_insta/base.html' %}
{% block content %}
<div class="feed-pane">
  <h1>{{profile.username}} followers: </h1>
  <div style="display: flex; flex-direction: column;">
  {% for follower in profile.get_followers %}
  <div class="profile-rectangle">
    <a href="{% url 'show_profile' follower.pk %}">
      <img src="{{follower.profile_image_url}}" width="50px" height="50px">
      <p> {{follower.username}} </p>
      <p> {{follower.display_name}} </p>
    </a>
   
    </div>
     <hr/>
  {% endfor %}
   </div>
   </div>
{% endblock %}
