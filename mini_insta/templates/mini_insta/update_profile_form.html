{% extends "mini_insta/base.html" %}
{% block content %}
  <h2>Update Profile for {{profile.username}}</h2>
  <div>
  <form method="POST">
    {% csrf_token %}
    <table>
    {{form.as_table}}
    </table>
    <input type="submit" name="submit" value="Submit">
  </form>
  <!--Return to the profile-->

  <form method="GET"  action="{% url 'show_profile' profile.pk %}">
    <input type="submit" name="Cancel" value="Cancel">
  </form>
  </div>
{% endblock %}
