{% extends 'mini_insta/base.html' %}
{% block content %}
  <h2>Create a Post for {{profile.username}}</h2>
  <form method="POST" >
    {% csrf_token %}
    <table>
      {{form.as_table}}
    </table>
    <input type="submit" name="submit">
      <a href="{% url 'show_all_profiles' %}"><input type="button" name="cancel" value="Cancel"></a>
  </form>   
{% endblock %}
