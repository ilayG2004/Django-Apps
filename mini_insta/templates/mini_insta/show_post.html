-->
{% extends 'mini_insta/base.html' %}
{% block content %}
  <div>
    <div class="post-photos-wrapper">
      <div class="post-photos-row">
        {% for photo in post.get_all_photos %}
          <div class="post-photo-item">
            <img src="{{photo.get_image_url}}">
            <p>{{photo.timestamp}}</p>
          </div>
        {% endfor %}
      </div>
      <p>{{post.caption}}</p>
    </div>
    <div class="delete-update-post-container">
      <a href="{% url 'delete_post' post.pk %}">Delete Post</a>
      <a href="{% url 'update_post' post.pk %}">Update Post</a>
    </div>
  </div>
{% endblock %}
