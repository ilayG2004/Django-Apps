-->
{% extends 'mini_insta/base.html' %}
{% block content %}
  <div class="post-photos-wrapper">
    <div class="post-photos-row">
      {% for photo in post.get_all_photos %}
        <div class="post-photo-item">
          <img src="{{photo.image_url}}">
          <p>{{photo.timestamp}}</p>
        </div>
      {% endfor %}
    </div>
    <p>{{post.caption}}</p>
  </div>
{% endblock %}
