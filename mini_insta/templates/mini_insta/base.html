<!--
File: mini_insta/base.html
Author: Ilay Guler (ilay2004@bu.edu), 2/12/2026
Description: The base html content for our app. Containing a nav bar with a big home button, and a "user-pane" which either
displays all users or a single user depending on the view. Modular. 

Changes 2/19: Includes a footer with a link to create a post when under a user profile.
-->
{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>Mini Insta</title>
    <link rel="stylesheet"  href="{% static 'mini_insta.css' %}">
  </head>
  <body>
    <h2>Mini Insta</h2>
    <hr>
    <div class="pane-parent">
      <div class="nav-pane">
        <a href="{% url 'show_all_profiles' %}"><img src="{% static 'images/frutiger_aero_home.png' %}"></a>
      </div>

      <div class="users-pane">
        {% block content %}

        {% endblock %}
      </div>
      <footer>
      {% if profile %}
        <a href="{% url 'create_post' pk=profile.pk%}" class="create-post">Create Post</a>
      {% endif %}
      </footer>
    </div>
    
  </body>
</html>
