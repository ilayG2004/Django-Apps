<!--
File: mini_insta/show_all_profiles.html
Author: Ilay Guler (ilay2004@bu.edu), 2/12/2026
Description: Access all profile objects in the Profile models, display their username, display name, and profile picture. 
Wrap each profile rectangle in a link which directs you to the DetailView of that single profile.
-->
{% extends 'mini_insta/base.html' %}
{% block content %}
  {% for profile in profiles %}
    <div class="profile-rectangle">
      <a href="{% url 'show_profile' profile.pk %}">
        <img src={{profile.profile_image_url}} width="100px" height="auto">
        <div class="profile-innerColumn">
          <h4>{{profile.username}}</h4>
          <h5>{{profile.display_name}}</h5>
        </div>
      </a>
    </div>
  {% endfor %}
{% endblock %}
