{% extends 'mini_insta/base.html' %}
{% block content %}
  {% for profile in profiles %}
    <div class="profile-rectangle">
      <a href="{% url 'show_profile' profile.pk %}">
        <img src={{profile.profile_image_url}} width="100px" height="auto">
        <div class="profile-innerColumn">
          <h4>{{profile.username}}</h4>
          <h5>{{profile.display_name}}</h5>
        </div>
      </a>
    </div>
  {% endfor %}
{% endblock %}
