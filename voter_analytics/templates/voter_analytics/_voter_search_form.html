<!--

# Author: Ilay Guler (ilay2004@bu.edu), 3/20/2026
# Description: Dynamically makes GET request to either our default listview or graph listview page to get queryset based on the parameters it attached on its GET request
-->
<form method="GET" action="{% if not visuals %} {% url 'voters' %} {% else %} {% url 'graphs' %}{% endif %}
">
  
  <!-- Party Affiliation -->
  <label for="party">Party Affiliation:</label>
  <select name="party" id="party">
    <option value="">Any</option>
    <option value="D " {% if request.GET.party == "D" %}selected{% endif %}>Democrat</option>
    <option value="R " {% if request.GET.party == "R" %}selected{% endif %}>Republican</option>
    <option value="U " {% if request.GET.party == "U" %}selected{% endif %}>Unaffiliated</option>
  </select>

  <br><br>

  <!-- Minimum Year of Birth -->
  <label for="min_year">Min Year of Birth:</label>
  <select name="min_year">
  <option value="">Any</option>
  {% for year in years %}
    <option value="{{ year }}"
      {% if request.GET.min_year == year|stringformat:"s" %}
        selected
      {% endif %}
    >
      {{ year }}
    </option>
  {% endfor %}
  </select>

  <br><br>

  <!-- Maximum Year of Birth -->
  <label for="max_year">Max Year of Birth:</label>
  <select name="max_year">
  <option value="">Any</option>
  {% for year in years %}
    <option value="{{ year }}"
      {% if request.GET.max_year == year|stringformat:"s" %}
        selected
      {% endif %}
    >
      {{ year }}
    </option>
  {% endfor %}
  </select>

  <br><br>

  <!-- Voter Score -->
  <label for="voter_score">Voter Score:</label>
  <select name="voter_score" id="voter_score">

    <!-- Default option -->
    <option value="" {% if not request.GET.voter_score %}selected{% endif %}>
      Any
    </option>

    <!-- Dynamic options -->
    {% for score in scores %}
      <option value="{{ score }}"
        {% if request.GET.voter_score == score|stringformat:"s" %}selected{% endif %}>
        {{ score }}
      </option>
    {% endfor %}

  </select>

  <br><br>

  <!-- Voting History -->
  <label>Voted In:</label><br>

  <input type="checkbox" name="v20state" value="1"  {% if request.GET.v20state %}checked{% endif %}> 2020 State<br>
  <input type="checkbox" name="v21town" value="1"  {% if request.GET.v21town %}checked{% endif %}> 2021 Town<br>
  <input type="checkbox" name="v21primary" value="1"  {% if request.GET.v21primary %}checked{% endif %}> 2021 Primary<br>
  <input type="checkbox" name="v22general" value="1"  {% if request.GET.v22general %}checked{% endif %}> 2022 General<br>
  <input type="checkbox" name="v23town" value="1"  {% if request.GET.v23town %}checked{% endif %}> 2023 Town<br>

  <br>

  <button type="submit">Search</button>
</form>
