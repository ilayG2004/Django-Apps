{% extends 'quotes/base.html' %}
{% load static %}

{% block content %}
  <h2>All quotes of LeBron.</h2>
  {% for quote in quotes %}
    <p>{{ quote }}</p>
  {% endfor %}
  <h2>All images of LeBron.</h2>
  <table>
    {% for img in images %}
    <tr>
      <img src="{% static img %}" width="200">
    </tr>
    {% endfor %}
  </table>
{% endblock %}
